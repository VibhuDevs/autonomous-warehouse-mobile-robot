# ==========================================
# AMR BOT CONTROLLER CONFIGURATION
# ==========================================

controller_manager:
  ros__parameters:
    update_rate: 50

    # Controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ==========================================
# DIFFERENTIAL DRIVE CONTROLLER
# ==========================================

diff_drive_controller:
  ros__parameters:

    # One powered wheel per side; the front and rear casters are passive.
    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    # Physical dimensions (meters)
    wheel_separation: 0.55
    wheel_radius: 0.10

    # Odometry configuration
    odom_frame_id: odom
    base_frame_id: base_link

    enable_odom_tf: true
    position_feedback: true
    open_loop: false

    # Publishing
    publish_rate: 50.0
    publish_limited_velocity: true

    # Command configuration
    use_stamped_vel: true
    cmd_vel_timeout: 0.5

    # Velocity limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.50
        min_velocity: -0.25
        has_acceleration_limits: true
        max_acceleration: 0.7
        min_acceleration: -0.7

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.2
        min_acceleration: -1.2
